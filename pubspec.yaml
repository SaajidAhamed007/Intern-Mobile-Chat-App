name: internchat
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase dependencies (compatible versions)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.2

  # Notification dependencies (compatible version)
  flutter_local_notifications: ^17.2.3

  # Other dependencies
  provider: ^6.1.5+1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.3.2
  http: ^1.5.0
  image_picker: ^1.0.5
  file_picker: ^8.1.2
  permission_handler: ^11.1.0
  video_player: ^2.8.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/HASA.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/HASA.png"
  min_sdk_android: 21
